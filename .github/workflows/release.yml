# On every `v*` tag: build Linux (x86_64, aarch64) and attach the archives to
# the GitHub release, like tubevibe. File names carry no version, so links can
# point at https://github.com/mortbrew/boxvibe/releases/latest/download/<file>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Release (once; the builds below add their files to it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "boxvibe $TAG"

  linux:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # The tag is the release version, so `dev` never has to drop its `-dev`
      # suffix to cut one. `dev` carries `0.6.3-dev`; tagging `v0.6.3` builds a
      # binary that reports `0.6.3`, which is what the archive is named after.
      - name: Version from the tag
        run: |
          version="${TAG#v}"
          case "$version" in
            *-*) echo "::error::tag $TAG carries a prerelease suffix; tag a release version" >&2; exit 1 ;;
          esac
          sed -i "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          grep -q "^version = \"$version\"$" Cargo.toml || { echo "::error::could not set version" >&2; exit 1; }
          # The lockfile names boxvibe's own version, so it has to follow or
          # `--locked` fails. Rewrite that one entry rather than running
          # `cargo update`: the latter resolves the whole graph, and the
          # `vibekit` git dependency is not in the cache on a fresh runner, so
          # it needs the network and fails under `--offline`.
          python3 - "$version" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("Cargo.lock").read()
          new, n = re.subn(r'(name = "boxvibe"\nversion = ")[^"]*(")', r'\g<1>' + version + r'\g<2>', text)
          if n != 1:
              sys.exit(f"expected one boxvibe entry in Cargo.lock, found {n}")
          open("Cargo.lock", "w").write(new)
          PY
          echo "building $version from tag $TAG"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/boxvibe
          cp target/release/boxvibe README.md dist/boxvibe/
          tar -C dist -czf dist/boxvibe-${{ matrix.arch }}-linux.tar.gz boxvibe
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: dist/boxvibe-${{ matrix.arch }}-linux.tar.gz
