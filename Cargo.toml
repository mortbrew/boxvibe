[package]
name = "boxvibe"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
description = "Pandora in the terminal: a CarPlay-style TUI with stations, thumbs, themes and icon sets (Rust + ratatui)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mortbrew/boxvibe"
homepage = "https://github.com/mortbrew/boxvibe"
readme = "README.md"
keywords = ["pandora", "tui", "ratatui", "music", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/screenshots", "/tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
directories = "6.0.0"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4"] }
rustfft = "6"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
tar = "0.4.46"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"
unicode-width = "0.2.2"
ureq = "3"

[profile.release]
lto = "thin"
strip = true
