[package]
name = "boxvibe"
version = "0.6.3-dev"
edition = "2024"
rust-version = "1.90"
description = "Pandora in the terminal: a CarPlay-style TUI with stations, thumbs, themes and icon sets (Rust + ratatui)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mortbrew/boxvibe"
homepage = "https://github.com/mortbrew/boxvibe"
readme = "README.md"
keywords = ["pandora", "tui", "ratatui", "music", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/docs/screenshots"]

[dependencies]
vibekit = { git = "https://github.com/mortbrew/vibekit", tag = "v0.2.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4"] }
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
syom = "0.10.1"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"
unicode-width = "0.2.2"
ureq = "3"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
# The README screenshots: `src/screenshots.rs` rasterizes the demo frames.
ab_glyph = "0.2.32"

[profile.release]
lto = "thin"
strip = true
